
server:
  port: 8083

spring:
  application:
    name: producto-service

  datasource:
    url: jdbc:mysql://localhost:3306/bd_producto_dev
    username: root
    password: ""

resilience4j:
  circuitbreaker:
    instances:
      categoriaService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
